name: Update geosite & geoip JSON

on:
  schedule:
    - cron: "0 3 * * *"  # ежедневно в 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Run parser
        run: |
          rm -f geosite.dat geoip.dat geosite.json geoip.json
          node --experimental-json-modules parse.js

          echo "=== Directory contents after script execution ==="
          ls -la

          echo "=== First few lines of geosite.json ==="
          head -n 10 geosite.json

          echo "=== First few lines of geoip.json ==="
          head -n 10 geoip.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Ровно один перевод строки в конце. Прошлый шаг дописывал пустую строку,
          # из-за этого на следующий день diff пропадал и git commit падал.
          for file in geosite.json geoip.json; do
            perl -i -0777 -pe 's/\n*\z/\n/' "$file"
          done

          git add -f geosite.json geoip.json
          if git diff --cached --quiet; then
            echo "Изменений нет, коммит не нужен"
            exit 0
          fi

          git commit -m "update: geo data $(date +'%Y-%m-%d %H:%M:%S')"
          git push
